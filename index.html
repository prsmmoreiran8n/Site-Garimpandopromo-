<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpandopromo — Grupos de Promoção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0906;
    --bg-glow: #1d130a;
    --wood: #7c5a34;
    --wood-dark: #35281a;
    --panel: #1c1712;
    --panel-hover: #241d16;
    --border: #3a2f22;
    --metal: #17130f;
    --gold: #cf9b41;
    --gold-bright: #f2c169;
    --tag-red: #b1392c;
    --text: #f2e6d0;
    --text-muted: #a8927a;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- HERO: arte do garimpeiro, esmaecendo pro fundo ---------- */
  .hero-wrap {
    position: relative;
    width: 100%;
    max-width: 620px;
    line-height: 0;
  }

  .hero-wrap img {
    width: 100%;
    display: block;
  }

  .hero-fade {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 40%;
    background: linear-gradient(to bottom, transparent 0%, var(--bg) 92%);
    pointer-events: none;
  }

  .poeira {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particula {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold-bright);
    opacity: 0;
    animation: flutuar 7s ease-in-out infinite;
  }
  @keyframes flutuar {
    0%   { opacity: 0; transform: translateY(0); }
    15%  { opacity: 0.5; }
    85%  { opacity: 0.25; }
    100% { opacity: 0; transform: translateY(-46px); }
  }

  .page {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 40px;
    margin-top: -34px;
    position: relative;
    z-index: 1;
  }

  .brand {
    text-align: center;
    margin-bottom: 32px;
  }

  h1 {
    font-family: 'Rye', serif;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,0.55), 0 0 26px rgba(207,155,65,0.25);
  }

  .tagline {
    margin-top: 14px;
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.55;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }

  .tagline strong { color: var(--gold-bright); font-weight: 600; }

  nav {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- Botão = placa de madeira recortada da própria arte ---------- */
  .grupo {
    display: block;
    width: 100%;
    text-decoration: none;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    position: relative;
  }

  .grupo::before,
  .grupo::after {
    content: '';
    position: absolute;
    top: 8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(207,155,65,0.35);
    z-index: 2;
  }
  .grupo::before { left: 8px; }
  .grupo::after { right: 8px; }

  .grupo:hover {
    border-color: var(--gold);
    background: var(--panel-hover);
    transform: translateY(-2px);
  }
  .grupo:active { transform: translateY(0); }
  .grupo:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }

  .placa img {
    width: 100%;
    display: block;
  }

  .info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--wood-dark);
    border-top: 1px solid var(--border);
  }

  .info-bar .desc {
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .seta {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s ease, stroke 0.15s ease;
  }
  .grupo:hover .seta {
    transform: translateX(3px);
    stroke: var(--gold-bright);
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .particula { animation: none; opacity: 0.2; }
    .grupo { transition: none; }
  }
</style>
</head>
